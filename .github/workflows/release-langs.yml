name: Release Language Ports
on:
  # Main calls this right after changesets publishes the npm package.
  workflow_call:
  # Releases the current version by hand, e.g. after the one-time registry setup.
  workflow_dispatch:

concurrency:
  group: release-langs-${{ github.ref }}
  cancel-in-progress: false

# Main verifies every port before changesets publishes, and a manual run releases `main`, which CI
# has verified.
jobs:
  rust:
    name: Publish Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check versions
        run: node langs/version.ts --check

      # Exchanges the workflow's OIDC token for a short-lived crates.io token (trusted publishing).
      - name: Authenticate with crates.io
        id: auth
        uses: wevm/actions/vendor/rust-lang/crates-io-auth-action/rev-3268eb413133@73e899a58d51092d694fbaf94b7a1d8c09bfea28

      # `incur` pins `incur-macros` exactly, so the macros publish first.
      - name: Publish crates
        working-directory: langs/rust
        run: |
          cargo publish -p incur-macros
          cargo publish -p incur
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    name: Publish Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check versions
        run: node langs/version.ts --check

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.9/install.sh | sh

      # `uv publish` uses PyPI trusted publishing through the workflow's OIDC token.
      - name: Build and publish
        working-directory: langs/python
        run: uv build && uv publish

  zig:
    name: Release Zig
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Check versions
        run: |
          node langs/version.ts --check
          echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Install Zig
        run: |
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar xJf /tmp/zig.tar.xz -C "$HOME"
          echo "$HOME/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      # Zig has no registry: a package is a tarball URL. The tarball holds only `langs/zig`, so its
      # own build.zig and build.zig.zon sit at the package root. It attaches to the npm release.
      - name: Package and upload
        run: |
          file="incur-zig-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="incur/" -o "$file" "$GITHUB_SHA:langs/zig"
          echo "Package hash: $(zig fetch "$file")"
          gh release upload "incur@$VERSION" "$file" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
