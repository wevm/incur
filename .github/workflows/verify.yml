name: Verify
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref_type }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code
        run: pnpm check

      - name: Check types
        run: pnpm check:types

      - name: Check language port versions
        run: node langs/version.ts --check

  test:
    name: Test Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: pnpm run test --bail=1 --coverage
        env:
          CI: true

      - name: Upload coverage reports to Codecov
        uses: wevm/actions/vendor/codecov/codecov-action/v4.6.0@b518cf981b50a4c745a8b7335fc693f34b108a75

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: langs/rust
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # The differential suite runs the TypeScript reference with Node.js.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Cache Rust builds
        uses: wevm/actions/vendor/Swatinem/rust-cache/v2.9.2@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          workspaces: langs/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        run: curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.2/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C "$HOME/.cargo/bin"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint crates
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features incur/client -- -D warnings

      - name: Check docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test docs
        run: cargo test --workspace --doc

      # Differential, API, and derive tests, failing on any uncovered line.
      # rust-cache disables incremental builds, which inline small functions across crates and
      # leave llvm-cov with mismatched copies that it reports as uncovered.
      - name: Test crates with coverage
        run: cargo llvm-cov --workspace --fail-uncovered-lines 0 --show-missing-lines
        env:
          CARGO_INCREMENTAL: 1

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: langs/python
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # The differential suite runs the TypeScript reference with Node.js.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.9/install.sh | sh

      - name: Sync environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Check types
        run: uv run pyright

      # Differential, API, schema, and doc tests, failing below 100% branch coverage.
      - name: Test with coverage
        run: uv run coverage erase && uv run coverage run -m pytest && uv run coverage report

  zig:
    name: Zig
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: langs/zig
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # The differential suite runs the TypeScript reference with Node.js.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Zig and kcov
        run: |
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar xJf /tmp/zig.tar.xz -C "$HOME"
          echo "$HOME/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y kcov

      - name: Check formatting
        run: zig fmt --check .

      # API, README, compile-error, and differential tests.
      - name: Test
        run: zig build test

      # The same tests under kcov, failing on any uncovered line in src/.
      - name: Test with coverage
        run: zig build coverage
