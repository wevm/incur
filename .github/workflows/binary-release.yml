name: Incur Binary Release

on:
  workflow_call:
    inputs:
      entry:
        description: TypeScript entrypoint in the caller repository
        required: true
        type: string
      package_manager:
        description: Dependency package manager (auto, npm, pnpm, or bun)
        default: auto
        required: false
        type: string
      pnpm_version:
        description: pnpm fallback version when packageManager does not declare one
        default: '10.30.2'
        required: false
        type: string
      name:
        description: Binary and release asset name
        required: true
        type: string
      smoke_command:
        description: Single command passed to each built binary for a native smoke test
        required: true
        type: string
      release_tag:
        description: Existing stable release tag matching v<package version>
        required: true
        type: string
      sign_macos:
        description: Sign and notarize macOS binaries
        default: false
        required: false
        type: boolean
      sign_windows:
        description: Authenticode-sign and timestamp Windows binaries
        default: false
        required: false
        type: boolean
      attest:
        description: Attest final release assets
        default: false
        required: false
        type: boolean
      bun_version:
        description: Bun compiler version
        default: '1.3.10'
        required: false
        type: string
    secrets:
      APPLE_API_ISSUER:
        description: Apple App Store Connect API issuer
        required: false
      APPLE_API_KEY_ID:
        description: Apple App Store Connect API key ID
        required: false
      APPLE_API_KEY_P8_BASE64:
        description: Base64-encoded Apple App Store Connect API private key
        required: false
      APPLE_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Developer ID Application certificate
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password for the Developer ID certificate
        required: false
      APPLE_SIGNING_IDENTITY:
        description: Developer ID Application signing identity
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: Password for the Authenticode certificate
        required: false
      WINDOWS_CERTIFICATE_PFX_BASE64:
        description: Base64-encoded Authenticode certificate
        required: false
      WINDOWS_TIMESTAMP_URL:
        description: Authenticode RFC 3161 timestamp server URL
        required: false

permissions:
  contents: read

env:
  BINARY_ENTRY: ${{ inputs.entry }}
  BINARY_NAME: ${{ inputs.name }}
  BINARY_OUTPUT: dist/binaries
  BINARY_SMOKE_COMMAND: ${{ inputs.smoke_command }}
  BUN_VERSION: ${{ inputs.bun_version }}

jobs:
  validate:
    name: Validate existing release
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate version and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json must contain a stable semantic version." >&2
            exit 1
          fi

          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Expected release tag ${expected_tag}, received ${RELEASE_TAG}." >&2
            exit 1
          fi

          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "Binary.github supports public GitHub repositories only." >&2
            exit 1
          fi

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]; then
            echo "The release must not be a prerelease." >&2
            exit 1
          fi
          if [[ "$(jq -r .draft <<< "$release")" != "true" ]]; then
            echo "The release must remain a draft until every binary asset is uploaded." >&2
            exit 1
          fi

          {
            echo "commit=$(git rev-parse HEAD)"
            echo "release_tag=${RELEASE_TAG}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build canonical matrix
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Bun compiler
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve package manager
        id: package-manager
        env:
          REQUESTED_PACKAGE_MANAGER: ${{ inputs.package_manager }}
        shell: bash
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').packageManager || ''")"
          manager="$REQUESTED_PACKAGE_MANAGER"
          if [[ "$manager" == "auto" ]]; then
            manager="${declared%%@*}"
            if [[ -z "$manager" ]]; then
              managers=()
              [[ -f pnpm-lock.yaml ]] && managers+=(pnpm)
              [[ -f package-lock.json ]] && managers+=(npm)
              [[ -f bun.lock || -f bun.lockb ]] && managers+=(bun)
              if [[ "${#managers[@]}" -ne 1 ]]; then
                echo "Could not infer one package manager. Set package_manager explicitly." >&2
                exit 1
              fi
              manager="${managers[0]}"
            fi
          fi
          case "$manager" in
            npm|pnpm|bun) ;;
            *)
              echo "Unsupported package manager: ${manager}. Expected npm, pnpm, or bun." >&2
              exit 1
              ;;
          esac
          pnpm_declared=false
          if [[ "$manager" == "pnpm" && "$declared" == pnpm@* ]]; then
            pnpm_declared=true
          fi
          {
            echo "name=${manager}"
            echo "pnpm_declared=${pnpm_declared}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up declared pnpm
        if: >-
          ${{ steps.package-manager.outputs.name == 'pnpm' &&
          steps.package-manager.outputs.pnpm_declared == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up fallback pnpm
        if: >-
          ${{ steps.package-manager.outputs.name == 'pnpm' &&
          steps.package-manager.outputs.pnpm_declared != 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ inputs.pnpm_version }}

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ steps.package-manager.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            bun) bun install --frozen-lockfile ;;
          esac

      - name: Build all targets
        env:
          PACKAGE_MANAGER: ${{ steps.package-manager.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            pnpm) incur=(pnpm exec incur) ;;
            npm) incur=(npm exec --offline -- incur) ;;
            bun) incur=(bunx --no-install incur) ;;
          esac
          "${incur[@]}" build "$BINARY_ENTRY" \
            --installer \
            --name "$BINARY_NAME" \
            --output "$BINARY_OUTPUT" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION"

      - name: Verify checksums and asset names
        shell: bash
        run: |
          set -euo pipefail
          cd "$BINARY_OUTPUT"
          sha256sum --check SHA256SUMS

          expected=(
            "${BINARY_NAME}-darwin-arm64.gz"
            "${BINARY_NAME}-darwin-x64.gz"
            "${BINARY_NAME}-linux-arm64-glibc.gz"
            "${BINARY_NAME}-linux-arm64-musl.gz"
            "${BINARY_NAME}-linux-x64-glibc-baseline.gz"
            "${BINARY_NAME}-linux-x64-musl-baseline.gz"
            "${BINARY_NAME}-windows-arm64.exe.gz"
            "${BINARY_NAME}-windows-x64-baseline.exe.gz"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          find . -maxdepth 1 -type f -name '*.gz' -exec basename {} \; |
            sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          test -f install.sh
          test -f install.ps1

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-binaries
          if-no-files-found: error
          path: |
            ${{ env.BINARY_OUTPUT }}/*.gz
            ${{ env.BINARY_OUTPUT }}/SHA256SUMS
            ${{ env.BINARY_OUTPUT }}/install.ps1
            ${{ env.BINARY_OUTPUT }}/install.sh
          retention-days: 1

  smoke-unix:
    name: Smoke ${{ matrix.target }}
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64-glibc-baseline
          - runner: ubuntu-24.04-arm
            target: linux-arm64-glibc
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download compressed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: assets

      - name: Verify, decompress, and smoke
        env:
          ASSET: ${{ env.BINARY_NAME }}-${{ matrix.target }}.gz
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets

          digest="$(
            awk -v asset="$ASSET" '$2 == asset || $2 == "*" asset { print $1 }' SHA256SUMS
          )"
          if [[ -z "$digest" ]]; then
            echo "Missing checksum for ${ASSET}." >&2
            exit 1
          fi
          actual="$(shasum -a 256 "$ASSET" | awk '{ print $1 }')"
          if [[ "$actual" != "$digest" ]]; then
            echo "Checksum mismatch for ${ASSET}." >&2
            exit 1
          fi

          binary="$RUNNER_TEMP/$BINARY_NAME"
          gzip -dc "$ASSET" > "$binary"
          chmod +x "$binary"
          "$binary" --help > /dev/null
          actual_version="$("$binary" --version)"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version ${EXPECTED_VERSION}, received ${actual_version}." >&2
            exit 1
          fi
          "$binary" "$BINARY_SMOKE_COMMAND"

  smoke-musl:
    name: Smoke ${{ matrix.target }}
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64-musl-baseline
          - runner: ubuntu-24.04-arm
            target: linux-arm64-musl
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download compressed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: assets

      - name: Verify, decompress, and smoke in Alpine
        env:
          ASSET: ${{ env.BINARY_NAME }}-${{ matrix.target }}.gz
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets

          digest="$(
            awk -v asset="$ASSET" '$2 == asset || $2 == "*" asset { print $1 }' SHA256SUMS
          )"
          if [[ -z "$digest" ]]; then
            echo "Missing checksum for ${ASSET}." >&2
            exit 1
          fi
          actual="$(shasum -a 256 "$ASSET" | awk '{ print $1 }')"
          if [[ "$actual" != "$digest" ]]; then
            echo "Checksum mismatch for ${ASSET}." >&2
            exit 1
          fi

          binary="$RUNNER_TEMP/$BINARY_NAME"
          gzip -dc "$ASSET" > "$binary"
          chmod +x "$binary"
          docker run --rm \
            --volume "$RUNNER_TEMP:/smoke:ro" \
            alpine:3.22 \
            "/smoke/$BINARY_NAME" --help > /dev/null
          actual_version="$(
            docker run --rm \
              --volume "$RUNNER_TEMP:/smoke:ro" \
              alpine:3.22 \
              "/smoke/$BINARY_NAME" --version
          )"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version ${EXPECTED_VERSION}, received ${actual_version}." >&2
            exit 1
          fi
          docker run --rm \
            --volume "$RUNNER_TEMP:/smoke:ro" \
            alpine:3.22 \
            "/smoke/$BINARY_NAME" "$BINARY_SMOKE_COMMAND"

  smoke-windows:
    name: Smoke ${{ matrix.target }}
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64-baseline
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download compressed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: assets

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'assets/install.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'install.ps1 failed PowerShell parsing.'
          }

      - name: Verify, decompress, and smoke
        env:
          ASSET: ${{ env.BINARY_NAME }}-${{ matrix.target }}.exe.gz
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path 'assets' $env:ASSET
          $line = Get-Content 'assets/SHA256SUMS' |
            Where-Object { $_ -match "[ *]$([regex]::Escape($env:ASSET))$" }
          if (-not $line) {
            throw "Missing checksum for $env:ASSET."
          }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $env:ASSET."
          }

          $binary = Join-Path $env:RUNNER_TEMP "$env:BINARY_NAME.exe"
          node -e "require('node:fs').writeFileSync(process.argv[2], require('node:zlib').gunzipSync(require('node:fs').readFileSync(process.argv[1])))" $asset $binary
          & $binary --help | Out-Null
          $actualVersion = (& $binary --version | Out-String).Trim()
          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "Expected version $env:EXPECTED_VERSION, received $actualVersion."
          }
          & $binary $env:BINARY_SMOKE_COMMAND

  macos-assets:
    name: Prepare macOS assets
    needs: [validate, build, smoke-unix]
    runs-on: macos-15-intel

    steps:
      - name: Download compressed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: assets

      - name: Decompress macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/macos"
          for target in darwin-arm64 darwin-x64; do
            gzip -dc "assets/${BINARY_NAME}-${target}.gz" \
              > "$RUNNER_TEMP/macos/${BINARY_NAME}-${target}"
            chmod +x "$RUNNER_TEMP/macos/${BINARY_NAME}-${target}"
          done

      - name: Report unsigned macOS build
        if: ${{ !inputs.sign_macos }}
        run: echo "macOS signing and notarization were explicitly disabled."

      - name: Sign and notarize macOS binaries
        if: ${{ inputs.sign_macos }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_API_ISSUER
            APPLE_API_KEY_ID
            APPLE_API_KEY_P8_BASE64
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}." >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          cleanup() {
            rm -f "$certificate" "$api_key"
            security delete-keychain "$keychain" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$api_key"
          chmod 600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          cat > "$RUNNER_TEMP/bun-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key>
            <true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          PLIST

          for target in darwin-arm64 darwin-x64; do
            binary="$RUNNER_TEMP/macos/${BINARY_NAME}-${target}"
            archive="${binary}.zip"
            codesign \
              --entitlements "$RUNNER_TEMP/bun-entitlements.plist" \
              --force \
              --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" \
              --timestamp \
              "$binary"
            codesign --verify --deep --strict --verbose=2 "$binary"
            ditto -c -k --keepParent "$binary" "$archive"
            xcrun notarytool submit "$archive" \
              --issuer "$APPLE_API_ISSUER" \
              --key "$api_key" \
              --key-id "$APPLE_API_KEY_ID" \
              --wait
            rm "$archive"
          done

      - name: Recompress final macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          for target in darwin-arm64 darwin-x64; do
            gzip -9 -n -c "$RUNNER_TEMP/macos/${BINARY_NAME}-${target}" \
              > "final/${BINARY_NAME}-${target}.gz"
          done

      - name: Upload final macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-binaries
          if-no-files-found: error
          path: final/*.gz
          retention-days: 1

  smoke-final-macos:
    name: Smoke final ${{ matrix.target }}
    needs: [validate, macos-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download final macOS assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-binaries
          path: assets

      - name: Decompress and smoke final binary
        env:
          ASSET: ${{ env.BINARY_NAME }}-${{ matrix.target }}.gz
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/$BINARY_NAME"
          gzip -dc "assets/$ASSET" > "$binary"
          chmod +x "$binary"
          "$binary" --help > /dev/null
          actual_version="$("$binary" --version)"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version ${EXPECTED_VERSION}, received ${actual_version}." >&2
            exit 1
          fi
          "$binary" "$BINARY_SMOKE_COMMAND"

  windows-assets:
    name: Prepare Windows assets
    needs: [validate, build, smoke-windows]
    runs-on: windows-latest

    steps:
      - name: Download compressed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: assets

      - name: Decompress Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows" | Out-Null
          foreach ($target in @('windows-arm64', 'windows-x64-baseline')) {
            $asset = "assets/$env:BINARY_NAME-$target.exe.gz"
            $binary = "$env:RUNNER_TEMP/windows/$env:BINARY_NAME-$target.exe"
            node -e "require('node:fs').writeFileSync(process.argv[2], require('node:zlib').gunzipSync(require('node:fs').readFileSync(process.argv[1])))" $asset $binary
          }

      - name: Report unsigned Windows build
        if: ${{ !inputs.sign_windows }}
        run: echo "Windows signing and timestamping were explicitly disabled."

      - name: Sign and timestamp Windows binaries
        if: ${{ inputs.sign_windows }}
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'WINDOWS_CERTIFICATE_PASSWORD',
            'WINDOWS_CERTIFICATE_PFX_BASE64',
            'WINDOWS_TIMESTAMP_URL'
          )
          foreach ($name in $required) {
            if (-not (Get-Item "env:$name").Value) {
              throw "Missing required secret: $name."
            }
          }

          $certificate = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          $signtool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signtool) {
            throw 'SignTool was not found on the runner.'
          }

          try {
            foreach ($target in @('windows-arm64', 'windows-x64-baseline')) {
              $binary = "$env:RUNNER_TEMP/windows/$env:BINARY_NAME-$target.exe"
              & $signtool.FullName sign `
                /fd SHA256 `
                /f $certificate `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                /tr $env:WINDOWS_TIMESTAMP_URL `
                /td SHA256 `
                $binary
              & $signtool.FullName verify /pa /all /v $binary
            }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $certificate
          }

      - name: Recompress final Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'final' | Out-Null
          foreach ($target in @('windows-arm64', 'windows-x64-baseline')) {
            $binary = "$env:RUNNER_TEMP/windows/$env:BINARY_NAME-$target.exe"
            $asset = "final/$env:BINARY_NAME-$target.exe.gz"
            node -e "require('node:fs').writeFileSync(process.argv[2], require('node:zlib').gzipSync(require('node:fs').readFileSync(process.argv[1]), { level: 9 }))" $binary $asset
          }

      - name: Upload final Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          if-no-files-found: error
          path: final/*.gz
          retention-days: 1

  smoke-final-windows:
    name: Smoke final ${{ matrix.target }}
    needs: [validate, windows-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64-baseline
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download final Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binaries
          path: assets

      - name: Decompress and smoke final binary
        env:
          ASSET: ${{ env.BINARY_NAME }}-${{ matrix.target }}.exe.gz
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path 'assets' $env:ASSET
          $binary = Join-Path $env:RUNNER_TEMP "$env:BINARY_NAME.exe"
          node -e "require('node:fs').writeFileSync(process.argv[2], require('node:zlib').gunzipSync(require('node:fs').readFileSync(process.argv[1])))" $asset $binary
          & $binary --help | Out-Null
          $actualVersion = (& $binary --version | Out-String).Trim()
          if ($actualVersion -ne $env:EXPECTED_VERSION) {
            throw "Expected version $env:EXPECTED_VERSION, received $actualVersion."
          }
          & $binary $env:BINARY_SMOKE_COMMAND

  release:
    name: Upload to existing release
    needs:
      - validate
      - build
      - smoke-unix
      - smoke-musl
      - smoke-windows
      - macos-assets
      - smoke-final-macos
      - windows-assets
      - smoke-final-windows
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Download unsigned assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-binaries
          path: release

      - name: Download final macOS assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-binaries
          path: overrides/macos

      - name: Download final Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binaries
          path: overrides/windows

      - name: Assemble final asset set
        shell: bash
        run: |
          set -euo pipefail
          cp overrides/macos/*.gz release/
          cp overrides/windows/*.gz release/

          cd release
          rm -f SHA256SUMS
          sha256sum -- *.gz | sort -k 2 > SHA256SUMS
          sha256sum --check SHA256SUMS

          expected=(
            "${BINARY_NAME}-darwin-arm64.gz"
            "${BINARY_NAME}-darwin-x64.gz"
            "${BINARY_NAME}-linux-arm64-glibc.gz"
            "${BINARY_NAME}-linux-arm64-musl.gz"
            "${BINARY_NAME}-linux-x64-glibc-baseline.gz"
            "${BINARY_NAME}-linux-x64-musl-baseline.gz"
            "${BINARY_NAME}-windows-arm64.exe.gz"
            "${BINARY_NAME}-windows-x64-baseline.exe.gz"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          find . -maxdepth 1 -type f -name '*.gz' -exec basename {} \; |
            sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"

      - name: Attest final release assets
        if: ${{ inputs.attest }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/*

      - name: Revalidate existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$(jq -r .tag_name <<< "$release")" != "$RELEASE_TAG" ]]; then
            echo "Release tag changed before upload." >&2
            exit 1
          fi
          if [[ "$(jq -r .prerelease <<< "$release")" == "true" ]]; then
            echo "Release became a prerelease before upload." >&2
            exit 1
          fi
          if [[ "$(jq -r .draft <<< "$release")" != "true" ]]; then
            echo "Release was published before every binary asset was ready." >&2
            exit 1
          fi
          commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha
          )"
          if [[ "$commit" != "${{ needs.validate.outputs.commit }}" ]]; then
            echo "Release tag moved after validation." >&2
            exit 1
          fi

          existing="$(jq -r '.assets[].name' <<< "$release")"
          for file in release/*.gz release/SHA256SUMS release/install.ps1 release/install.sh; do
            asset="$(basename "$file")"
            if grep -Fxq "$asset" <<< "$existing"; then
              echo "Release asset already exists: ${asset}." >&2
              exit 1
            fi
          done

      - name: Upload assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release/*.gz \
            release/SHA256SUMS \
            release/install.ps1 \
            release/install.sh \
            --repo "$GITHUB_REPOSITORY"
