# Copy this small caller to .github/workflows/binary-release.yml.
# Pin the reusable workflow to a full commit SHA before production use.
name: Binary Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag matching v<package version>
        required: true
        type: string
      sign_macos:
        description: Sign and notarize macOS binaries
        default: false
        required: true
        type: boolean
      sign_windows:
        description: Authenticode-sign and timestamp Windows binaries
        default: false
        required: true
        type: boolean
      attest:
        description: Attest final release assets
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Release binaries
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: wevm/incur/.github/workflows/binary-release.yml@main
    with:
      attest: ${{ inputs.attest }}
      entry: ./src/bin.ts
      name: my-cli
      release_tag: ${{ inputs.release_tag }}
      sign_macos: ${{ inputs.sign_macos }}
      sign_windows: ${{ inputs.sign_windows }}
      smoke_command: ping
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
